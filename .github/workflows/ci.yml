name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT types
        run: npx wxt prepare

      - name: Type check
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Build Chrome
        run: npm run build

      - name: Build Firefox
        run: npm run build:firefox

      - name: Validate filter lists
        run: node scripts/validate-filter-lists.mjs

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-build-node-${{ matrix.node-version }}
          path: .output/chrome-mv3/

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mv2-build-node-${{ matrix.node-version }}
          path: .output/firefox-mv2/